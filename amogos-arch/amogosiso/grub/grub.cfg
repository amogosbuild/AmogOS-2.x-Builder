# Boot AmogOS Arch with Zen and Plymouth under UEFI.
set default=amogos
set timeout=8
insmod all_video
insmod serial
serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial

menuentry 'AmogOS 2 Pro (Arch)' --id amogos {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}
menuentry 'AmogOS 2 Pro (Arch) — basic graphics' --hotkey b {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}
menuentry 'AmogOS 2 Pro (Arch) — boot diagnostics' --hotkey d {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200 systemd.log_target=console
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}
menuentry 'UEFI firmware settings' {
    fwsetup
}

# Boot the Zen kernel when this ISO is attached through GRUB loopback.
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"
menuentry 'AmogOS 2 Pro (Arch)' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

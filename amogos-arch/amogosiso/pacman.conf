# Require signed packages and use the official mirror before the community repositories.
[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Required
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[amogos-arch]
SigLevel = Required
Server = https://amogosbuild.github.io/amogos-arch/x86_64

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

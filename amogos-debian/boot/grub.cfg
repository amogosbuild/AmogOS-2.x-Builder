# GRUB starts the same live filesystem through either BIOS or UEFI firmware.
set default=amogos-live
set timeout=8
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search
insmod search_fs_file
insmod linux
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
search --no-floppy --file --set=root /live/filesystem.squashfs
menuentry "AmogOS 2 Pro 2.1 Live" --id=amogos-live {
    linux /live/vmlinuz boot=live components username=user hostname=amogos locales=en_US.UTF-8 quiet splash
    initrd /live/initrd
}
menuentry "AmogOS 2 Pro 2.1 Live (basic graphics)" --hotkey=b {
    linux /live/vmlinuz boot=live components username=user hostname=amogos nomodeset quiet splash
    initrd /live/initrd
}
menuentry "AmogOS 2 Pro 2.1 Live (boot diagnostics / serial console)" --hotkey=d {
    linux /live/vmlinuz boot=live components username=user hostname=amogos console=tty0 console=ttyS0,115200n8 systemd.log_target=console
    initrd /live/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI firmware settings" {
        fwsetup
    }
fi
